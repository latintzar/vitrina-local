name: Vitrina source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npx --yes pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - run: npx --yes pnpm@10.32.1 lint
      - run: npx --yes pnpm@10.32.1 build
      - run: npx --yes pnpm@10.32.1 test
